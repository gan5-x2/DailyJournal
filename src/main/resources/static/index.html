<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日计 - Auth Version</title>
    <link href="/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --modal-bg: #1e1e1e;
            --card-bg: #252525;
            --key-bg: #2c2c2c;
            --text-main: #e0e0e0;
            --text-sub: #757575;
            --border-color: #333;

            --color-expense: #d32f2f;
            --color-income: #00c853;

            --icon-food: #ffb74d; --icon-transport: #64b5f6; --icon-shopping: #ba68c8;
            --icon-home: #4db6ac; --icon-fun: #fff176; --icon-medical: #e57373;
            --icon-edu: #7986cb; --icon-social: #f06292; --icon-other: #bdbdbd;
            --icon-salary: #69f0ae; --icon-part: #b9f6ca;
        }

        body.light-theme {
            --bg-color: #f5f5f5; --modal-bg: #ffffff; --card-bg: #eeeeee;
            --key-bg: #e0e0e0; --text-main: #212121; --text-sub: #757575; --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- 登录页样式 --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        .login-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .login-input {
            padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--card-bg); color: var(--text-main); font-size: 1rem; outline: none;
        }
        .code-row { display: flex; gap: 10px; }
        .btn-send-code {
            padding: 0 20px; border-radius: 8px; border: none;
            background: var(--color-income); color: black; font-weight: bold; cursor: pointer; white-space: nowrap;
        }
        .btn-send-code:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-login {
            padding: 15px; border-radius: 8px; border: none;
            background: var(--text-main); color: var(--bg-color); font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        /* --- 原有样式保持不变 --- */
        .header {
            padding: 20px; background: linear-gradient(to bottom, rgba(26,26,26,0.9), var(--bg-color));
            display: flex; justify-content: space-between; align-items: flex-end; height: 100px;
        }
        .date-info h2 { font-size: 1rem; font-weight: normal; color: var(--text-sub); margin-bottom: 5px; }
        .total-display { text-align: right; }
        .total-amount { font-size: 2.5rem; font-weight: bold; letter-spacing: -1px; transition: color 0.3s; }
        .total-amount span { font-size: 1.5rem; color: var(--text-sub); }

        .text-expense { color: var(--color-expense); }
        .text-income { color: var(--color-income); }

        .content-area { flex: 1; overflow-y: auto; padding: 0 20px 80px 20px; position: relative; }
        .empty-state { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: var(--text-sub); font-size: 0.9rem; text-align: center; width: 100%; }

        .timeline-item { display: flex; padding: 15px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; align-items: center; transition: background 0.2s; }
        .timeline-item:active { background-color: rgba(128,128,128,0.1); }

        .item-left { width: 50px; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-right: 15px; }
        .item-icon {
            width: 36px; height: 36px; background: var(--card-bg); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 14px; color: #aaa;
        }

        .icon-food { color: var(--icon-food) !important; }
        .icon-transport { color: var(--icon-transport) !important; }
        .icon-shopping { color: var(--icon-shopping) !important; }
        .icon-home { color: var(--icon-home) !important; }
        .icon-fun { color: var(--icon-fun) !important; }
        .icon-medical { color: var(--icon-medical) !important; }
        .icon-edu { color: var(--icon-edu) !important; }
        .icon-social { color: var(--icon-social) !important; }
        .icon-other { color: var(--icon-other) !important; }
        .icon-salary { color: var(--icon-salary) !important; }
        .icon-part { color: var(--icon-part) !important; }

        .item-time { font-size: 0.75rem; color: var(--text-sub); }
        .item-mid { flex: 1; }
        .item-title { font-size: 1rem; margin-bottom: 4px; font-weight: 500; }
        .item-desc { font-size: 0.75rem; color: var(--text-sub); }
        .item-right { text-align: right; }
        .item-amount { font-size: 1.1rem; font-weight: 600; }

        .fab-group { position: fixed; left: 20px; bottom: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 100; }
        .fab {
            width: 50px; height: 50px; background-color: var(--card-bg); color: var(--text-main);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid var(--border-color);
        }
        .fab.settings-btn { width: 50px; height: 50px; font-size: 20px; opacity: 0.8; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 200; justify-content: center; align-items: flex-end; }
        .modal-box {
            background: var(--modal-bg); width: 100%; max-width: 500px;
            border-radius: 20px 20px 0 0; padding: 20px;
            animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto;
            display: flex; flex-direction: column;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .top-bar { display: flex; align-items: center; margin-bottom: 15px; gap: 10px; }
        .back-btn { color: var(--text-sub); font-size: 0.9rem; cursor: pointer; }

        .type-toggle { display: flex; background: #333; border-radius: 8px; padding: 2px; }
        .type-btn {
            padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
            color: #aaa; transition: all 0.2s;
        }
        .type-btn.active.expense-mode { background: var(--color-expense); color: white; font-weight: bold; }
        .type-btn.active.income-mode { background: var(--color-income); color: black; font-weight: bold; }

        .calc-screen {
            background: var(--card-bg); color: var(--text-main); font-size: 2.5rem;
            text-align: right; padding: 20px; border-radius: 12px; margin-bottom: 20px;
            min-height: 80px; display: flex; align-items: center; justify-content: flex-end;
        }

        .cat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .tag {
            background: var(--card-bg); padding: 6px 14px; border-radius: 16px;
            font-size: 0.85rem; color: var(--text-sub); cursor: pointer;
            border: 1px solid transparent; display: flex; align-items: center; gap: 5px;
        }
        .tag i { font-size: 0.8rem; opacity: 0.7; }
        .tag.active { background: var(--text-main); color: var(--bg-color); border-color: var(--text-main); font-weight: bold; }
        .tag.active i { opacity: 1; }

        .tag.color-food { color: var(--icon-food); border-color: rgba(255, 183, 77, 0.3); background: rgba(255, 183, 77, 0.1); }
        .tag.color-transport { color: var(--icon-transport); border-color: rgba(100, 181, 246, 0.3); background: rgba(100, 181, 246, 0.1); }
        .tag.color-shopping { color: var(--icon-shopping); border-color: rgba(186, 104, 200, 0.3); background: rgba(186, 104, 200, 0.1); }
        .tag.color-home { color: var(--icon-home); border-color: rgba(77, 182, 172, 0.3); background: rgba(77, 182, 172, 0.1); }
        .tag.color-fun { color: var(--icon-fun); border-color: rgba(255, 241, 118, 0.3); background: rgba(255, 241, 118, 0.1); }
        .tag.color-medical { color: var(--icon-medical); border-color: rgba(229, 115, 115, 0.3); background: rgba(229, 115, 115, 0.1); }
        .tag.color-edu { color: var(--icon-edu); border-color: rgba(121, 134, 203, 0.3); background: rgba(121, 134, 203, 0.1); }
        .tag.color-social { color: var(--icon-social); border-color: rgba(240, 98, 146, 0.3); background: rgba(240, 98, 146, 0.1); }
        .tag.color-other { color: var(--icon-other); border-color: rgba(189, 189, 189, 0.3); background: rgba(189, 189, 189, 0.1); }
        .tag.color-salary { color: var(--icon-salary); border-color: rgba(105, 240, 174, 0.3); background: rgba(105, 240, 174, 0.1); }
        .tag.color-part { color: var(--icon-part); border-color: rgba(185, 246, 202, 0.3); background: rgba(185, 246, 202, 0.1); }
        .tag.active[class*="color-"] { background: var(--text-main); color: var(--bg-color); border-color: var(--text-main); }

        .sub-cat-area {
            background: var(--card-bg); padding: 10px; border-radius: 8px;
            min-height: 40px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
            margin-bottom: 15px; border: 1px solid var(--border-color);
        }
        .sub-tag { background: var(--key-bg); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; color: var(--text-sub); cursor: pointer; }
        .sub-tag.active { background: var(--text-sub); color: var(--bg-color); }

        .note-row { display:flex; align-items:center; margin-bottom:15px; color:var(--text-sub); border-bottom:1px solid var(--border-color); padding-bottom:10px; }
        .note-row input { background:transparent; border:none; color:var(--text-main); flex:1; outline:none; }

        .confirm-btn {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; cursor: pointer;
        }
        .confirm-btn.expense-confirm { background: var(--color-expense); color: white; }
        .confirm-btn.income-confirm { background: var(--color-income); color: black; }

        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .key { background: var(--key-bg); border: none; color: var(--text-main); font-size: 1.3rem; padding: 18px 0; border-radius: 10px; }
        .key-del { background: var(--color-expense); color: white; }

        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .detail-title-group { display: flex; align-items: center; gap: 10px; flex: 1; }
        .detail-icon-circle {
            width: 40px; height: 40px; background: var(--card-bg); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #ccc; border: 1px solid var(--border-color); flex-shrink: 0;
        }
        .detail-name-display { font-size: 1.2rem; font-weight: bold; }
        .detail-amount-display { font-size: 1.5rem; font-weight: bold; }
        .edit-input-num { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px; border-radius: 8px; font-size: 1.2rem; width: 100px; text-align: right; }
        .detail-info-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.95rem; color: var(--text-sub); }
        .detail-info-val { color: var(--text-main); }
        .detail-actions { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color); }
        .btn-text { background: none; border: none; color: var(--text-main); font-size: 1rem; cursor: pointer; padding: 10px; }
        .btn-text.red { color: var(--color-expense); }
        .btn-text.bold { font-weight: bold; color: var(--text-main); }

        .settings-header { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;}
        .setting-group { margin-bottom: 25px; }
        .setting-label { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; display: block; }
        .option-list { display: flex; flex-direction: column; gap: 1px; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
        .option-item { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: var(--modal-bg); color: var(--text-main); }
        .option-item.active { background: rgba(0, 200, 83, 0.15); color: var(--color-income); font-weight: bold; }
        .option-item i.check { opacity: 0; }
        .option-item.active i.check { opacity: 1; }
        .feedback-input { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; outline: none; resize: none; min-height: 100px; margin-bottom: 10px; }
        .send-btn { width: 100%; padding: 12px; background: var(--color-income); color: black; border: none; border-radius: 8px; font-weight: bold; }

        /* 新增：退出登录按钮样式 */
        .logout-btn { width: 100%; padding: 12px; background: var(--color-expense); color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }

    </style>
</head>
<body>

<!-- 【新增】登录/注册 全屏遮罩层 -->
<div id="login-overlay" style="display:none;">
    <h1 style="margin-bottom:30px; font-size:2rem;">日计 - 登录</h1>

    <div class="login-box">
        <!-- 邮箱输入 (type改为email) -->
        <input type="email" id="login-phone" class="login-input" placeholder="请输入邮箱地址">

        <!-- 验证码输入 + 发送按钮 -->
        <div class="code-row">
            <input type="text" id="login-code" class="login-input" placeholder="验证码" style="flex:1;">
            <button id="btn-send-code" class="btn-send-code" onclick="sendLoginCode()">获取验证码</button>
        </div>

        <!-- 登录按钮 -->
        <button class="btn-login" onclick="doLogin()">登录 / 注册</button>
    </div>

    <p style="margin-top:20px; color:var(--text-sub); font-size:0.8rem;">首次使用将自动注册账号</p>
</div>

<!-- 原有主界面结构 -->
<div class="header">
    <div class="date-info"><h2 id="headerDate">2026-09-29</h2></div>
    <div class="total-display">
        <div class="total-amount" id="headerTotalDisplay">
            <span id="totalSign">-</span><span id="totalValue">0.0</span>
        </div>
    </div>
</div>

<div class="content-area">
    <div class="empty-state" id="emptyState">还没有记录，来记一笔吧</div>
    <div id="listContainer"></div>
</div>

<div class="fab-group">
    <div class="fab settings-btn" onclick="openSettings()"><i class="fas fa-cog"></i></div>
    <div class="fab" onclick="openAddModal()"><i class="fas fa-plus"></i></div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
        <div class="settings-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="back-btn" onclick="closeSettings()" style="font-size:1.2rem;"><i class="fas fa-chevron-left"></i></div>
                <span data-i18n="settings">设置</span>
            </div>
        </div>
        <div class="setting-group">
            <span class="setting-label" data-i18n="language">语言 / Language</span>
            <div class="option-list" id="langList">
                <div class="option-item active" onclick="setLanguage('zh-CN', this)"><span>简体中文</span><i class="fas fa-check check"></i></div>
                <div class="option-item" onclick="setLanguage('zh-TW', this)"><span>繁體中文</span><i class="fas fa-check check"></i></div>
                <div class="option-item" onclick="setLanguage('en', this)"><span>English</span><i class="fas fa-check check"></i></div>
                <div class="option-item" onclick="setLanguage('ja', this)"><span>日本語</span><i class="fas fa-check check"></i></div>
            </div>
        </div>
        <div class="setting-group">
            <span class="setting-label" data-i18n="theme">主题 / Theme</span>
            <div class="option-list" id="themeList">
                <div class="option-item" onclick="setTheme('system', this)"><span data-i18n="sysTheme">跟随系统</span><i class="fas fa-check check"></i></div>
                <div class="option-item" onclick="setTheme('light', this)"><span data-i18n="lightTheme">浅色模式</span><i class="fas fa-check check"></i></div>
                <div class="option-item active" onclick="setTheme('dark', this)"><span data-i18n="darkTheme">深色模式</span><i class="fas fa-check check"></i></div>
            </div>
        </div>
        <div class="setting-group">
            <span class="setting-label" data-i18n="feedback">意见反馈</span>
            <textarea id="feedbackContent" class="feedback-input" placeholder="请输入建议..."></textarea>
            <button class="send-btn" id="feedbackBtn" onclick="submitFeedback()"><i class="fas fa-paper-plane"></i> <span data-i18n="sendFeedback">发送</span></button>
        </div>
        <!-- 【新增】退出登录按钮 -->
        <div class="setting-group">
            <button class="logout-btn" onclick="doLogout()">退出登录</button>
        </div>
    </div>
</div>

<!-- 记账弹窗 -->
<div class="modal-overlay" id="addModal">
    <div class="modal-box">
        <div class="top-bar">
            <div class="back-btn" onclick="closeAddModal()"><i class="fas fa-chevron-left"></i> <span data-i18n="back">返回</span></div>
            <div class="type-toggle">
                <div class="type-btn expense-mode active" id="btnExpense" onclick="switchType('expense')" data-i18n="expense">支出</div>
                <div class="type-btn income-mode" id="btnIncome" onclick="switchType('income')" data-i18n="income">收入</div>
            </div>
        </div>

        <div class="calc-screen" id="calcScreen">0</div>
        <div class="cat-section">
            <div class="cat-row" id="mainCats"></div>
        </div>
        <div class="sub-cat-area" id="subCatArea"></div>

        <div class="note-row">
            <i class="far fa-sticky-note" style="margin-right:10px;"></i>
            <input type="text" id="newNote" placeholder="写点备注..." style="background:transparent; border:none; color:var(--text-main); flex:1; outline:none;">
            <span style="font-size:0.8rem; color:var(--text-sub);" id="currentDateSmall">09-29</span>
        </div>

        <button class="confirm-btn expense-confirm" id="confirmBtn" onclick="submitRecord()">√</button>

        <div class="numpad">
            <button class="key" onclick="pressKey('1')">1</button><button class="key" onclick="pressKey('2')">2</button><button class="key" onclick="pressKey('3')">3</button><button class="key key-del" onclick="pressKey('del')"><i class="fas fa-backspace"></i></button>
            <button class="key" onclick="pressKey('4')">4</button><button class="key" onclick="pressKey('5')">5</button><button class="key" onclick="pressKey('6')">6</button><button class="key" onclick="pressKey('+')">+</button>
            <button class="key" onclick="pressKey('7')">7</button><button class="key" onclick="pressKey('8')">8</button><button class="key" onclick="pressKey('9')">9</button><button class="key" onclick="pressKey('-')">-</button>
            <button class="key" onclick="pressKey('C')">C</button><button class="key" onclick="pressKey('0')">0</button><button class="key" onclick="pressKey('.')">.</button><button class="key" onclick="pressKey('=')">=</button>
        </div>
    </div>
</div>

<!-- 详情/编辑弹窗 -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-box">
        <div class="top-bar">
            <div class="back-btn" onclick="closeDetail()"><i class="fas fa-chevron-left"></i> <span data-i18n="back">返回</span></div>
            <div class="type-badge" style="background:#444; padding:2px 8px; border-radius:4px; font-size:0.8rem;" data-i18n="detail">详情</div>
        </div>

        <div class="detail-header">
            <div class="detail-title-group">
                <div class="detail-icon-circle" id="d-icon"><i class="fas fa-receipt"></i></div>
                <div id="d-name-display" class="detail-name-display">午餐</div>
                <div id="d-edit-cats" class="cat-row" style="display:none; flex:1; overflow-x:auto;"></div>
            </div>
            <div id="d-amount-display" class="detail-amount-display">-225</div>
            <input type="number" id="d-amount-edit" class="edit-input-num" style="display:none;">
        </div>

        <div id="d-sub-cat-container" style="margin-bottom: 15px; display:none;">
            <div class="sub-cat-area" id="d-sub-cat-area"></div>
        </div>

        <input type="text" id="d-note-edit" class="note-input-edit" placeholder="写点备注..." style="display:none; width:100%; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:8px; margin-bottom:20px; outline:none;">

        <div class="detail-info-row"><span data-i18n="creator">创建者:</span> <span class="detail-info-val" data-i18n="me">我</span></div>
        <div class="detail-info-row"><span data-i18n="time">时间:</span> <span class="detail-info-val" id="d-time">2026-09-29 19:08</span></div>

        <div class="detail-actions">
            <button class="btn-text red" onclick="deleteCurrentItem()" data-i18n="delete">删除</button>
            <div>
                <button class="btn-text" onclick="closeDetail()" data-i18n="cancel">取消</button>
                <button class="btn-text bold" id="editToggleBtn" onclick="toggleEditMode()" data-i18n="edit">编辑</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 1. 初始化与多语言 ---
    const today = new Date();
    const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    document.getElementById('headerDate').innerText = dateStr;
    document.getElementById('currentDateSmall').innerText = String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

    let expenses = [];
    let currentExp = "";
    let currentLang = 'zh-CN';
    let currentType = 'expense';

    let editingItemId = null;
    let isEditMode = false;
    let editMainCat = "";
    let editSubCat = "";

    function renderCategoryTags(containerId, selectedMain, onSelect, useColors = false) {
        const container = document.getElementById(containerId);
        if(!container) return;

            tag.innerHTML = `<i class="fas ${iconClass}"></i> ${catName}`;
            tag.className = `tag ${colorClass} ${catKey === selectedMain ? 'active' : ''}`;
            tag.onclick = () => onSelect(catKey);
            container.appendChild(tag);
        });
    }

    // 【核心修改】提交记录到后端 MySQL (带 Token)
    async function submitRecord() {
        if (!currentExp || currentExp === "0") return alert("请输入金额");
        let finalAmount; try { finalAmount = new Function('return ' + currentExp)(); } catch(e) { return alert("格式错误"); }
        if (finalAmount <= 0) return alert("金额必须大于0");

        let finalCatName = addSubCat;
        if (addMainCat.endsWith('_other')) finalCatName = addCustomText || "其他";

        const recordData = {
            amount: finalAmount,
            date: dateStr,
            note: document.getElementById('newNote').value,
            type: currentType,
            category: addMainCat,
            subCat: (addMainCat.endsWith('_other')) ? (addCustomText || "其他") : addSubCat
        };

        const token = localStorage.getItem('token');

        try {
            const response = await fetch('/api/save-expense', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(recordData)
            });

            if (response.ok) {
                const result = await response.text();
                if(result === 'success') {
                    closeAddModal();
                    currentExp = "";
                    document.getElementById('newNote').value = "";
                    addCustomText = "";
                    loadAndRenderData();
                } else {
                    alert("保存失败: " + result);
                }
            } else {
                alert("服务器连接失败");
            }
        } catch (error) {
            console.error(error);
            alert("网络异常，无法保存");
        }
    }

    // 【核心修改】从后端加载数据并渲染 (带 Token)
    async function loadAndRenderData() {
        const token = localStorage.getItem('token');
        if (!token) {
            document.getElementById('login-overlay').style.display = 'flex';
            return;
        }

        try {
            const response = await fetch('/api/get-expenses', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            if (!response.ok) throw new Error('网络响应异常');

            const data = await response.json();

            expenses = data.map(item => ({
                id: item.id,
                amount: parseFloat(item.amount),
                date: item.date,
                note: item.note || "",
                type: item.type || "expense",
                category: item.category || "cat_other",
                mainCat: item.category || "cat_other",
                subCat: item.subCat,
                time: "20:40",
                fullTime: item.date
            }));

            renderListUI();

        } catch (error) {
            console.error('加载数据失败:', error);
            expenses = [];
            renderListUI();
        }
    }

    // 纯 UI 渲染函数
    function renderListUI() {
        const container = document.getElementById('listContainer');
        const emptyState = document.getElementById('emptyState');
        const totalValueEl = document.getElementById('totalValue');
        const totalSignEl = document.getElementById('totalSign');

        container.innerHTML = '';

        let totalExpense = 0;
        let totalIncome = 0;

        if (expenses.length === 0) {
            emptyState.style.display = 'block';
            if(totalValueEl) totalValueEl.innerText = '0.0';
            if(totalSignEl) totalSignEl.innerText = '-';
            return;
        }

        emptyState.style.display = 'none';

        [...expenses].reverse().forEach(item => {
            if (item.type === 'expense') totalExpense += item.amount;
            else totalIncome += item.amount;

            let displayName = "";
            let iconClass = "fa-receipt";
            let colorStyle = "color: var(--color-expense)";
            let sign = "-";

            let mainCatName = i18n_cats[currentLang][item.category] || item.category;

            if (item.category && item.category.endsWith('_other')) {
                if (item.subCat && item.subCat.trim() !== "" && item.subCat !== item.category) {
                    displayName = item.subCat;
                } else {
                    displayName = mainCatName;
                }
                iconClass = item.type === 'expense' ? catIcons.expense['cat_other'] : catIcons.income['inc_other'];
            } else {
                displayName = mainCatName;
                if(item.category === 'cat_food') iconClass = "fa-utensils";
                else if(item.category === 'cat_transport') iconClass = "fa-bus";
                else if(item.category === 'cat_shopping') iconClass = "fa-bag-shopping";
                else if(item.category === 'cat_fun') iconClass = "fa-gamepad";
                else if(item.category === 'inc_salary') iconClass = "fa-wallet";
                else if(item.category === 'inc_part') iconClass = "fa-laptop-code";
            }

            if(item.type === 'income') { colorStyle = "color: var(--color-income)"; sign = "+"; }

            const html = `
            <div class="timeline-item" onclick="openDetail(${item.id})">
                <div class="item-left">
                    <div class="item-icon ${item.type === 'expense' ? catColorClasses.expense[item.category] : catColorClasses.income[item.category]}"><i class="fas ${iconClass}"></i></div>
                    <div class="item-time">${item.time}</div>
                </div>
                <div class="item-mid">
                    <div class="item-title">${displayName}</div>
                    <div class="item-desc">${item.note}</div>
                </div>
                <div class="item-right">
                    <div class="item-amount" style="${colorStyle}">${sign}${item.amount}</div>
                </div>
            </div>`;
            container.innerHTML += html;
        });

        const net = totalIncome - totalExpense;
        if(totalSignEl) totalSignEl.innerText = net >= 0 ? '+' : '-';
        if(totalValueEl) totalValueEl.innerText = Math.abs(net).toFixed(1);

        const totalDisplay = document.getElementById('headerTotalDisplay');
        if(totalDisplay) {
            totalDisplay.className = net >= 0 ? 'total-amount text-income' : 'total-amount text-expense';
        }
    }

    // 【核心修改】保存编辑时同步到后端
    async function toggleEditMode() {
        const item = expenses.find(e => e.id === editingItemId); if(!item) return;

        if (!isEditMode) {
            isEditMode = true;
            editMainCat = item.mainCat || item.category;
            editSubCat = item.subCat || item.category;
            editCustomText = "";
        } else {
            const newAmount = parseFloat(document.getElementById('d-amount-edit').value);
            if(newAmount && newAmount > 0) item.amount = newAmount;

            item.mainCat = editMainCat;
            item.subCat = (editMainCat.endsWith('_other')) ? (editCustomText || "其他") : editSubCat;
            item.note = document.getElementById('d-note-edit').value;
            item.category = editMainCat;

            const token = localStorage.getItem('token');

            // 尝试调用后端更新接口
            try {
                await fetch('/api/update-expense', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        id: item.id,
                        amount: item.amount,
                        category: item.category,
                        subCat: item.subCat,
                        note: item.note,
                        type: item.type
                    })
                });
            } catch (e) {
                console.warn("后端更新失败，仅更新了本地显示", e);
            }

            isEditMode = false;
            loadAndRenderData(); // 重新加载以确认数据一致性
        }
        updateDetailView(item);
    }

    // 【核心修改】删除时调用后端接口
    async function deleteCurrentItem() {
        if(!confirm(i18n[currentLang]['delete'] + "?")) return;

        const token = localStorage.getItem('token');

        try {
            // 假设后端删除接口为 /api/delete-expense?id=xxx
            const response = await fetch(`/api/delete-expense?id=${editingItemId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                closeDetail();
                loadAndRenderData(); // 重新从服务器拉取数据
            } else {
                alert("删除失败，服务器返回错误");
            }
        } catch (error) {
            console.error(error);
            alert("网络异常，删除失败");
        }
    }

    function closeDetail() { document.getElementById('detailModal').style.display = 'none'; editingItemId = null; isEditMode = false; }

    function pressKey(key) {
        const screen = document.getElementById('calcScreen');
        if (key === 'C') currentExp = "";
        else if (key === 'del') currentExp = currentExp.slice(0, -1);
        else if (key === '=') { calculateResult(); return; }
        else {
            const ops = ['+', '-', '*', '/'];
            if (ops.includes(key) && ops.includes(currentExp.slice(-1))) currentExp = currentExp.slice(0, -1) + key;
            else currentExp += key;
        }
        screen.innerText = currentExp || "0";
    }
    function calculateResult() {
        if (!currentExp) return;
        try {
            let safeExp = currentExp.replace(/×/g, '*').replace(/÷/g, '/');
            if (['+','-','*','/'].includes(safeExp.slice(-1))) safeExp = safeExp.slice(0, -1);
            currentExp = (Math.round(new Function('return ' + safeExp)() * 100) / 100).toString();
            document.getElementById('calcScreen').innerText = currentExp;
        } catch (e) { document.getElementById('calcScreen').innerText = "Error"; currentExp = ""; }
    }

    async function submitFeedback() {
        const content = document.getElementById('feedbackContent').value.trim();
        if (!content) return alert("请填写内容");
        const btn = document.getElementById('feedbackBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
        btn.disabled = true;
        try {
            const response = await fetch('/api/feedback', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: content })
            });
            if (response.ok) {
                const result = await response.text();
                if(result === 'success') {
                    alert("发送成功！");
                    document.getElementById('feedbackContent').value = '';
                } else alert('失败: ' + result);
            } else alert('服务器连接失败');
        } catch (error) { alert('无法连接后端'); }
        finally { btn.innerHTML = originalHtml; btn.disabled = false; }
    }

    function openAddModal() {
        currentExp = ""; document.getElementById('calcScreen').innerText = "0";
        document.getElementById('addModal').style.display = 'flex';
        switchType('expense');
    }
    function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    // --- 【新增】登录相关逻辑 ---

    window.onload = function() {
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');

        if (token && userId) {
            document.getElementById('login-overlay').style.display = 'none';
            updateTexts();
            loadAndRenderData();
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
        }
    };

    async function sendLoginCode() {
        const account = document.getElementById('login-phone').value.trim();
        const btn = document.getElementById('btn-send-code');

        if (!account || !account.includes('@')) {
            alert("请输入有效的邮箱地址");
            return;
        }

        btn.disabled = true;
        btn.innerText = "60s后重发";
        let seconds = 60;
        const timer = setInterval(() => {
            seconds--;
            btn.innerText = seconds + "s后重发";
            if (seconds <= 0) {
                clearInterval(timer);
                btn.disabled = false;
                btn.innerText = "获取验证码";
            }
        }, 1000);

        try {
            const res = await fetch('/api/auth/send-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: account })
            });
            const data = await res.json();
            alert(data.msg);
        } catch (e) {
            alert("网络异常，发送失败");
            clearInterval(timer);
            btn.disabled = false;
            btn.innerText = "获取验证码";
        }
    }

    async function doLogin() {
        const phone = document.getElementById('login-phone').value.trim();
        const code = document.getElementById('login-code').value.trim();

        if (!phone || !code) {
            alert("请填写邮箱和验证码");
            return;
        }

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone, code: code })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('userId', data.userId);

                alert("登录成功！欢迎回来。");
                document.getElementById('login-overlay').style.display = 'none';
                updateTexts();
                loadAndRenderData();
            } else {
                alert("登录失败: " + data.msg);
            }
        } catch (e) {
            alert("网络异常，登录失败");
        }
    }

    function doLogout() {
        if(confirm("确定要退出登录吗？")) {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            location.reload();
        }
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('settingsModal')) closeSettings();
        if (event.target == document.getElementById('addModal')) closeAddModal();
        if (event.target == document.getElementById('detailModal')) closeDetail();
    }
</script>
